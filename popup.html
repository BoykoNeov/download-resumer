<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  :root {
    --bg: #0f141b;
    --panel: #161d27;
    --panel-2: #1d2735;
    --line: #263241;
    --ink: #e7edf4;
    --ink-dim: #8a99ab;
    --ink-faint: #5c6b7d;
    --live: #35d0a5;   /* downloading */
    --wait: #f0b429;   /* waiting to retry */
    --dead: #f0596b;   /* failed / gave up */
    --accent: #5b9dff; /* controls */
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 360px;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 16px 12px;
    border-bottom: 1px solid var(--line);
  }
  .mark {
    width: 26px; height: 26px; flex: none;
    border-radius: 7px;
    background: linear-gradient(150deg, #223 0%, #1a2432 100%);
    border: 1px solid var(--line);
    display: grid; place-items: center;
  }
  .mark svg { width: 15px; height: 15px; }
  .title { font-weight: 650; letter-spacing: 0.2px; }
  .sub { color: var(--ink-faint); font-size: 11px; margin-top: 1px; }

  /* master toggle */
  .switch { margin-left: auto; position: relative; width: 42px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider {
    position: absolute; inset: 0; cursor: pointer;
    background: #2a3646; border-radius: 999px; transition: background .18s;
  }
  .slider::before {
    content: ""; position: absolute; height: 18px; width: 18px; left: 3px; top: 3px;
    background: #cdd6e0; border-radius: 50%; transition: transform .18s;
  }
  input:checked + .slider { background: var(--live); }
  input:checked + .slider::before { transform: translateX(18px); background: #06231b; }

  .section-label {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.2px;
    color: var(--ink-faint); padding: 12px 16px 6px;
  }

  /* bulk toolbar */
  .toolbar { display: flex; gap: 8px; padding: 0 16px 4px; }
  .tbtn {
    font-family: var(--sans); font-size: 11.5px; font-weight: 550;
    color: var(--ink-dim); background: var(--panel); border: 1px solid var(--line);
    border-radius: 7px; padding: 6px 10px; cursor: pointer; transition: all .15s;
  }
  .tbtn:hover:not(:disabled) { color: var(--ink); border-color: #33465a; background: var(--panel-2); }
  .tbtn.danger:hover:not(:disabled) { color: var(--dead); border-color: #4a2933; }
  .tbtn:disabled { opacity: .4; cursor: default; }
  .tbtn .n { font-family: var(--mono); opacity: .8; }

  /* per-row action icons */
  .act {
    flex: none; width: 24px; height: 24px; padding: 0;
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    color: var(--ink-faint); cursor: pointer; display: grid; place-items: center;
  }
  .act svg { width: 13px; height: 13px; }
  .act.cancel:hover { background: var(--panel-2); border-color: var(--line); color: var(--wait); }
  .act.clear:hover  { background: var(--panel-2); border-color: var(--line); color: var(--dead); }

  #list { padding: 0 10px 6px; max-height: 260px; overflow-y: auto; }
  .empty {
    padding: 20px 16px 24px; color: var(--ink-dim); line-height: 1.5;
  }
  .empty b { color: var(--ink); font-weight: 600; }

  .row {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 9px;
    padding: 10px 11px;
    margin: 6px;
  }
  .row-top { display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.live { background: var(--live); box-shadow: 0 0 0 3px rgba(53,208,165,.15); animation: pulse 1.4s infinite; }
  .dot.wait { background: var(--wait); box-shadow: 0 0 0 3px rgba(240,180,41,.15); }
  .dot.dead { background: var(--dead); }
  .dot.done { background: var(--accent); }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .45 } }

  .fname {
    font-size: 12px; font-weight: 550;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    flex: 1 1 auto; min-width: 0;
  }
  .retries { font-family: var(--mono); font-size: 11px; color: var(--wait); flex: none; }

  .bar { height: 5px; border-radius: 3px; background: var(--panel-2); margin-top: 9px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--live); width: 0%; transition: width .3s; }
  .meta { display: flex; justify-content: space-between; margin-top: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim); }
  .status-text { color: var(--ink-faint); }

  .settings { border-top: 1px solid var(--line); padding: 4px 16px 14px; }
  .field { display: flex; align-items: center; justify-content: space-between; padding: 9px 0; }
  .field label { color: var(--ink-dim); }
  .field input[type="number"] {
    width: 78px; text-align: right; font-family: var(--mono); font-size: 12px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
  }
  .field input:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .chk { display: flex; align-items: center; gap: 8px; padding: 9px 0; color: var(--ink-dim); cursor: pointer; }
  .chk input { accent-color: var(--live); width: 15px; height: 15px; }

  /* expand control */
  .toggle {
    flex: none; width: 24px; height: 24px; padding: 0; margin-left: 2px;
    background: transparent; border: 1px solid transparent; border-radius: 6px;
    color: var(--ink-dim); cursor: pointer; display: grid; place-items: center;
  }
  .toggle:hover { background: var(--panel-2); border-color: var(--line); color: var(--ink); }
  .toggle svg { width: 13px; height: 13px; transition: transform .18s; }
  .row.open .toggle svg { transform: rotate(180deg); }

  /* detail panel */
  .detail { display: none; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
  .row.open .detail { display: block; }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .k { font-size: 9.5px; text-transform: uppercase; letter-spacing: .8px; color: var(--ink-faint); }
  .stat .v { font-family: var(--mono); font-size: 12px; color: var(--ink); }
  .stat .v.warn { color: var(--wait); }

  .events-label-row { display: flex; align-items: center; justify-content: space-between; margin: 12px 0 6px; }
  .events-label {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: .8px;
    color: var(--ink-faint); margin: 0;
  }
  .copylog {
    font-family: var(--sans); font-size: 10.5px; font-weight: 550;
    color: var(--ink-dim); background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 6px; padding: 3px 8px; cursor: pointer; transition: all .15s;
  }
  .copylog:hover { color: var(--ink); border-color: #33465a; }

  .spark-wrap { margin-top: 10px; }
  .spark { width: 100%; height: 28px; display: block; }
  .spark polyline { fill: none; stroke: var(--live); stroke-width: 1.6; }
  .spark-empty { color: var(--ink-faint); font-size: 10.5px; padding: 2px 0; }
  .events { display: flex; flex-direction: column; gap: 0; }
  .ev { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; border-top: 1px dashed var(--line); }
  .ev:first-child { border-top: none; }
  .ev .t { font-family: var(--mono); font-size: 10.5px; color: var(--ink-faint); flex: none; width: 62px; }
  .ev .lab { font-size: 11px; font-weight: 600; flex: none; }
  .ev .ctx { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); margin-left: auto; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lab.live { color: var(--live); }
  .lab.wait { color: var(--wait); }
  .lab.dead { color: var(--dead); }
  .lab.accent { color: var(--accent); }
  .lab.faint { color: var(--ink-dim); }
  .ev-empty { color: var(--ink-faint); font-size: 11px; padding: 4px 0; }

  footer { padding: 0 16px 14px; color: var(--ink-faint); font-size: 10.5px; line-height: 1.5; }
</style>
</head>
<body>
  <header>
    <span class="mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#35d0a5" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 3v12"/><path d="m7 11 5 5 5-5"/><path d="M4 20h16"/>
      </svg>
    </span>
    <div>
      <div class="title">Download Resumer</div>
      <div class="sub">Auto-continues dropped downloads</div>
    </div>
    <label class="switch" title="Turn resuming on or off">
      <input type="checkbox" id="enabled" />
      <span class="slider"></span>
    </label>
  </header>

  <div class="section-label">Active downloads</div>
  <div class="toolbar">
    <button class="tbtn danger" id="cancelAll" disabled>Cancel all <span class="n" id="cancelCount"></span></button>
    <button class="tbtn" id="clearAll" disabled>Clear all <span class="n" id="clearCount"></span></button>
  </div>
  <div id="list"></div>

  <div class="settings">
    <div class="field">
      <label for="retryDelaySec">Wait between retries (sec)</label>
      <input type="number" id="retryDelaySec" min="1" max="120" />
    </div>
    <div class="field">
      <label for="maxRetryDelaySec">Max wait between retries (sec)</label>
      <input type="number" id="maxRetryDelaySec" min="1" max="86400" />
    </div>
    <div class="field">
      <label for="maxRetries">Give up after (stalled tries)</label>
      <input type="number" id="maxRetries" min="1" max="100000" />
    </div>
    <label class="chk">
      <input type="checkbox" id="notify" />
      Show a notification when a download finishes or fails
    </label>
  </div>

  <footer>
    Resuming keeps the original filename and continues from the bytes already on
    disk. If a download can't be resumed, you'll get a notification.
  </footer>

  <script src="popup.js"></script>
</body>
</html>
